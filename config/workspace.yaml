# 구성 초안. 값은 설계 후보이고 실측이 아니다.
# verified_g0a 가 false 인 동안 실장치 실행은 G0a 세션만 허용된다.
config_version: "3"
verified_g0a: false

table:
  # 블록을 작업대에 바로 놓는 구성. 모델 값이다.
  # G0b-0 관찰: 22.5 mm에서 블록 상단 1/3을 잡고 들림·10초 유지, 작업대 접촉 없음(한 위치 한 번).
  z_grasp_mm: 22.5
  tilt_deg: 5.0
  tilt_tol_deg: 5.0
  z_tol_mm: 1.0
  r_min_mm: 120.0  # 베이스 아래 투명 판과 여유를 둔다
  r_max_mm: 165.0
  r_step_mm: 5.0
  hover_lift_mm: 40.0

ranges:
  j1_deg: [70, 110]      # G0a 드라이런으로 확정
  j5_deg: [60, 120]      # G0a 드라이런으로 확정

# 아래는 G0a 후보다. 실측이 아니고 G0a 관찰로 확정한다.
park: [90, 90, 90, 90, 90]   # 모델 영자세(직립). 카메라 시야의 작업 영역을 가리는지 G0a에서 본다
gripper:
  open_sdk: 100          # 각도 감소가 개방 방향이다. 실제 폭은 G0a에서 잰다
  close_sdk: 147         # 사람이 맞춘 과거 파지에서 쓴 값. G0b에서 다시 판단한다

motion:
  min_time_ms: 1500
  ms_per_deg: 60         # 첫 실기라 느리게 둔다
  max_move_deg: 90
  first_move_time_ms: 8000
  grip_time_ms: 1500
  settle_ms: 500         # 이동시간 뒤 추가 대기. 도착은 조회로 따로 검사한다
  arrival_tol_deg: 3     # SDK 반환 비교 허용치. 축 실측이 아니다
