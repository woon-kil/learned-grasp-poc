<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 860" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <g id="scene">
      <!-- 책상 -->
      <rect x="0" y="40" width="500" height="600" fill="#e8c88a"/>
      <!-- 종이 -->
      <rect x="60" y="150" width="285" height="290" fill="#fff" stroke="#999"/>
      <!-- 베이스 -->
      <rect x="115" y="60" width="180" height="170" rx="14" fill="#555"/>
      <text x="205" y="150" font-size="22" fill="#fff" text-anchor="middle">베이스</text>
      <!-- 보드 마커 id 1 -->
      <rect x="187" y="320" width="34" height="32" fill="#fff" stroke="#000" stroke-width="3"/>
      <rect x="195" y="328" width="18" height="16" fill="#000"/>
      <text x="204" y="370" font-size="13" text-anchor="middle" fill="#000">보드 마커</text>
      <!-- 분홍 표시 -->
      <path d="M232,359 L254,310 L302,327 L278,378" fill="none" stroke="#e58fb0" stroke-width="7"/>
      <text x="300" y="398" font-size="13" text-anchor="middle" fill="#c2507c">분홍 표시</text>
      <!-- 글자 -->
      <text x="205" y="428" font-size="18" text-anchor="middle" fill="#2a7fb8" font-weight="bold">YAHBOOM 글자</text>
      <!-- 큰 마커 1 -->
      <rect x="355" y="210" width="90" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
      <rect x="372" y="225" width="56" height="50" fill="#000"/>
      <text x="400" y="308" font-size="13" text-anchor="middle">큰 마커(고정)</text>
      <!-- 큰 마커 2 -->
      <rect x="370" y="520" width="90" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
      <rect x="387" y="537" width="56" height="56" fill="#000"/>
      <text x="415" y="628" font-size="13" text-anchor="middle">큰 마커(고정)</text>
    </g>
  </defs>

  <rect width="1060" height="860" fill="#fafafa"/>
  <text x="530" y="32" font-size="24" text-anchor="middle" font-weight="bold">계약 3 블록 놓는 자리 (카메라 사진과 같은 방향: 위=베이스, 아래=글자)</text>

  <!-- 왼쪽 판: P1, P3 -->
  <g transform="translate(20,50)">
    <use href="#scene"/>
    <text x="250" y="30" font-size="20" text-anchor="middle" font-weight="bold">① P1 · P3 (1~10단계)</text>
    <!-- P1 -->
    <rect x="184" y="234" width="40" height="82" fill="#ffe14d" fill-opacity="0.85" stroke="#1f5fd1" stroke-width="4"/>
    <text x="110" y="280" font-size="22" font-weight="bold" fill="#1f5fd1" text-anchor="middle">P1</text>
    <line x1="132" y1="274" x2="180" y2="274" stroke="#1f5fd1" stroke-width="3" marker-end="url(#ah)"/>
    <!-- P3 -->
    <rect x="184" y="296" width="40" height="82" fill="none" stroke="#e0711b" stroke-width="4" stroke-dasharray="8 5"/>
    <text x="110" y="350" font-size="22" font-weight="bold" fill="#e0711b" text-anchor="middle">P3</text>
    <line x1="132" y1="344" x2="180" y2="344" stroke="#e0711b" stroke-width="3" marker-end="url(#ah)"/>
    <!-- 돌림 설명 -->
    <path d="M168,398 q36,14 72,0" fill="none" stroke="#333" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="250" y="680" font-size="15" text-anchor="middle">P1 = 베이스와 보드 마커 사이, 보드 마커가 보이게</text>
    <text x="250" y="702" font-size="15" text-anchor="middle">P3 = 보드 마커를 완전히 덮기 (6단계에서 y)</text>
    <text x="250" y="724" font-size="15" text-anchor="middle">돌림: 베이스 쪽 끝은 두고 글자 쪽 끝만 옆으로 약 1 cm</text>
  </g>

  <!-- 오른쪽 판: E1~E3 -->
  <g transform="translate(540,50)">
    <use href="#scene"/>
    <text x="250" y="30" font-size="20" text-anchor="middle" font-weight="bold">② E1 · E2 · E3 (11~13단계, 매번 y)</text>
    <!-- E1 -->
    <rect x="62" y="356" width="40" height="82" fill="#ffe14d" fill-opacity="0.85" stroke="#1d9a4a" stroke-width="4"/>
    <text x="82" y="402" font-size="18" font-weight="bold" fill="#1d9a4a" text-anchor="middle">E1</text>
    <!-- E2 -->
    <rect x="303" y="300" width="40" height="82" fill="#ffe14d" fill-opacity="0.85" stroke="#1d9a4a" stroke-width="4"/>
    <text x="323" y="346" font-size="18" font-weight="bold" fill="#1d9a4a" text-anchor="middle">E2</text>
    <!-- E3 -->
    <rect x="240" y="356" width="40" height="82" fill="#ffe14d" fill-opacity="0.85" stroke="#1d9a4a" stroke-width="4"/>
    <text x="260" y="402" font-size="18" font-weight="bold" fill="#1d9a4a" text-anchor="middle">E3</text>
    <text x="250" y="680" font-size="15" text-anchor="middle">E1 = 분홍 반대쪽(왼쪽)과 글자 쪽(아래)이 만나는 모서리</text>
    <text x="250" y="702" font-size="15" text-anchor="middle">E2 = 분홍 쪽(오른쪽) 가장자리, 큰 마커는 가리지 않기</text>
    <text x="250" y="724" font-size="15" text-anchor="middle">E3 = 글자 쪽(아래) 가장자리 · 셋 다 블록 전체가 종이 위</text>
  </g>

  <text x="530" y="820" font-size="15" text-anchor="middle" fill="#555">노란 사각형 = 블록(긴 변이 베이스→글자 방향). 크기·위치는 사진(marker-top-2 E1-00)을 보고 그린 눈대중이다.</text>
  <text x="530" y="842" font-size="15" text-anchor="middle" fill="#555">점선 P3는 보드 마커 위. 「자리가 아니다」가 뜨면 다시 놓으면 된다(재촬영 아님).</text>
</svg>
