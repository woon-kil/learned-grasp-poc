<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="700" height="560" fill="#fafafa"/>
<text x="350" y="30" font-size="20" font-weight="bold" text-anchor="middle">DB-6 블록 자리 (위에서 본 도식, 위 = 베이스, 모델 좌표 1 px = 1 mm)</text>
<rect x="100" y="60" width="500" height="470" fill="#fff" stroke="#999"/>
<circle cx="350" cy="130" r="62" fill="#555"/><text x="350" y="135" font-size="14" fill="#fff" text-anchor="middle">베이스 중심</text>
<rect x="335" y="240" width="30" height="60" fill="#ffe14d" stroke="#1f9d1f" stroke-width="3"/><rect x="337.5" y="257.5" width="25" height="25" fill="#222"/>
<text x="378" y="262" font-size="13" font-weight="bold" fill="#1f7a1f">블록(눕혀서) 중심 y≈140 mm</text><text x="378" y="280" font-size="12" fill="#1f7a1f">긴 변 60 mm 앞뒤, 폭 30 mm 좌우, 마커 위</text>
<rect x="340" y="298" width="20" height="20" fill="none" stroke="#555" stroke-width="2"/><text x="372" y="312" font-size="12" fill="#555">보드 마커 id 1 (약 y 177, 가리지 않는다)</text>
<text x="350" y="360" font-size="13" text-anchor="middle" fill="#a00">팔은 park에서 hover까지 이 블록 위로 내려온다(손끝 작업대 위 약 57 mm, 블록 윗면 약 30 mm).</text>
<text x="350" y="380" font-size="13" text-anchor="middle" fill="#a00">hover→grasp는 하지 않는다(손가락이 블록 양옆으로 내려가 접촉 위험).</text>
<text x="350" y="500" font-size="12" text-anchor="middle">배치는 사진 위에 그린 SVG(data/db6, 비공개)와 함께 안내하고, 놓은 뒤 Gemini 사진으로 확인한다.</text></svg>