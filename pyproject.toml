[project]
name = "learned-grasp-poc"
version = "0.1.0"
description = "DOFBOT Pro 자기 지도 파지 학습 PoC"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learned_grasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
